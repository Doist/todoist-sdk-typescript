name: Prepare release artifact

on:
    push:
        branches: [main, next]
    workflow_dispatch:
        inputs:
            source_sha:
                description: Reviewed current branch SHA; must equal this workflow run's head
                required: true
                type: string
            expected_version:
                description: Expected semantic-release version (first migration release 17.0.1)
                required: true
                type: string

permissions:
    contents: read
    packages: read

concurrency:
    group: todoist-sdk-release
    cancel-in-progress: false

jobs:
    pack:
        if: github.repository == 'todoist/todoist-sdk-typescript' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next')
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: actions/setup-node@v6
              with:
                  node-version-file: .nvmrc
                  package-manager-cache: false
            - name: Validate selected source
              env:
                  SELECTED_SHA: ${{ inputs.source_sha || github.sha }}
              run: |
                  test "$SELECTED_SHA" = "$GITHUB_SHA"
                  test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
                  test "$(git rev-parse "origin/$GITHUB_REF_NAME")" = "$GITHUB_SHA"
                  git merge-base --is-ancestor origin/main HEAD
            - name: Install locked dependencies without installing shared hooks
              run: npm ci --ignore-scripts --no-audit --no-fund
            - name: Calculate version without publication or remote push probes
              id: plan
              env:
                  EXPECTED_VERSION: ${{ inputs.expected_version }}
                  GH_TOKEN: ${{ github.token }}
                  GH_PACKAGES_TOKEN: ${{ github.token }}
              run: |
                  git clone --bare . .tmp/release-history.git
                  node_modules/.bin/semantic-release --dry-run --repository-url "file://$PWD/.tmp/release-history.git"
                  if test -f .tmp/release/plan.json; then
                      VERSION=$(node -p 'JSON.parse(require("fs").readFileSync(".tmp/release/plan.json")).version')
                      test -z "$EXPECTED_VERSION" || test "$VERSION" = "$EXPECTED_VERSION"
                      echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                  else
                      test -z "$EXPECTED_VERSION"
                  fi
            - name: Verify and pack once
              if: steps.plan.outputs.version != ''
              run: |
                  npm run verify
                  node scripts/release.mjs pack
            - uses: actions/upload-artifact@v4
              if: steps.plan.outputs.version != ''
              with:
                  name: todoist-sdk-release
                  path: |
                      .tmp/release/*.tgz
                      .tmp/release/release.json
                  include-hidden-files: true
                  if-no-files-found: error
                  retention-days: 90
